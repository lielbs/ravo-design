<!doctype html>
<html lang="he" dir="rtl">
<head><meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>העמוד לא נמצא — RAVO</title>
  <meta name="theme-color" content="#0d0f0c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .lost{min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px 0;
      background:radial-gradient(circle at 50% 42%,#2b3721 0,#171c13 40%,#0d0f0c 74%)}
    .lost img{margin:0 auto 30px;border-radius:24px;box-shadow:0 22px 56px rgba(0,0,0,.5)}
    .lost h1{font-size:clamp(38px,7vw,76px);margin-bottom:18px}
    .lost p{max-width:44ch;margin:0 auto 34px;font-size:18px;color:var(--muted)}
    .home{display:inline-flex;align-items:center;gap:11px;padding:15px 26px;border-radius:999px;
      background:var(--sage);color:#141809;font-weight:800;transition:transform .25s var(--ease)}
    .home:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <main class="lost">
    <div class="wrap">
      <img src="logo.svg" width="82" height="82" alt="">
      <p class="eyebrow clay">404</p>
      <h1>העמוד הזה לא נמצא.</h1>
      <p>אולי הקישור השתנה. אפשר לחזור בשקט לדף הבית של RAVO.</p>
      <a class="home" href="./">חזרה ל־RAVO</a>
    </div>
  </main>
</body>
</html>
