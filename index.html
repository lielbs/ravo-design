<!doctype html>
<html lang="he" dir="rtl">
  <head><meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RAVO" />
    <meta name="description" content="RAVO — הבית מסתדר. אתם נושמים." />
    <!--
      Keep the pilot out of search results.

      This is a discovery control and NOT a security control: it asks crawlers not to list the page,
      and it does nothing whatsoever about who may read a household's data. That boundary is Supabase
      Auth and RLS, and it is unaffected by anything here — an anonymous request to the REST API
      answers 401 with or without this tag.

      It matters more than the robots.txt beside it, and for a reason that is easy to miss: robots.txt
      is only honoured at an origin's root, so for lielbs.github.io/homy-household-os-site/ a crawler
      reads lielbs.github.io/robots.txt — a path this project does not own and which answers 404.
      A robots.txt shipped in dist is therefore inert on the pilot URL and effective only once the
      build is served from a domain root. This tag works on both.

      Remove it deliberately if RAVO ever wants a public, indexable page.
    -->
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="./icon.svg" />
    <!-- A tab that cannot render SVG falls back to the raster mark rather than to nothing. -->
    <link rel="alternate icon" href="./icon-192.png" sizes="192x192" />
    <!-- iOS ignores the manifest icons for the home screen and reads only this one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>RAVO — הבית מסתדר. אתם נושמים.</title>
    <!--
      Resolve the appearance before the first paint, so opening RAVO in dark mode never flashes the
      cream page first. This has to be inline and blocking; anything bundled runs too late. Keep the
      key and the two page colours in step with src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('homy-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#10120F')
          }
        } catch (error) { /* an unreadable localStorage just means the default light theme */ }
      })()
    </script>

    <link rel="modulepreload" crossorigin href="./assets/createLucideIcon-kr8UePCP.js">

    <link rel="modulepreload" crossorigin href="./assets/capture-BNrZxPEE.js">
    <link rel="stylesheet" crossorigin href="./assets/index-C-Mbn3qf.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
